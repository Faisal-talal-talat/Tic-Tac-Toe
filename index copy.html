<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Tic Tac Toe</h1>
      <p id="status">Player X's turn</p>
      <section class="board" aria-label="Tic Tac Toe board">
        <button class="cell" aria-label="Square 1"></button>
        <button class="cell" aria-label="Square 2"></button>
        <button class="cell" aria-label="Square 3"></button>
        <button class="cell" aria-label="Square 4"></button>
        <button class="cell" aria-label="Square 5"></button>
        <button class="cell" aria-label="Square 6"></button>
        <button class="cell" aria-label="Square 7"></button>
        <button class="cell" aria-label="Square 8"></button>
        <button class="cell" aria-label="Square 9"></button>
      </section>
      <button id="reset" type="button">New Game</button>
    </main>

    <script>
      const winningLines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      const cells = Array.from(document.querySelectorAll(".cell"));
      const statusText = document.querySelector("#status");
      const resetButton = document.querySelector("#reset");
      let board = Array(9).fill("");
      let currentPlayer = "X";
      let gameOver = false;

      function winningLine() {
        return winningLines.find(([a, b, c]) => {
          return board[a] && board[a] === board[b] && board[a] === board[c];
        });
      }

      function finishTurn() {
        const line = winningLine();
        if (line) {
          statusText.textContent = `Player ${currentPlayer} wins!`;
          line.forEach((index) => cells[index].classList.add("winner"));
          cells.forEach((cell) => {
            cell.disabled = true;
          });
          gameOver = true;
          return;
        }

        if (board.every(Boolean)) {
          statusText.textContent = "It's a draw!";
          gameOver = true;
          return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s turn`;
      }

      cells.forEach((cell, index) => {
        cell.addEventListener("click", () => {
          if (gameOver || board[index]) {
            return;
          }

          board[index] = currentPlayer;
          cell.textContent = currentPlayer;
          cell.disabled = true;
          finishTurn();
        });
      });

      resetButton.addEventListener("click", () => {
        board = Array(9).fill("");
        currentPlayer = "X";
        gameOver = false;
        statusText.textContent = "Player X's turn";
        cells.forEach((cell) => {
          cell.textContent = "";
          cell.disabled = false;
          cell.classList.remove("winner");
        });
      });
    </script>
  </body>
</html>
